

[platformio]
; Trỏ src và include tới thư mục Core của CubeMX
src_dir = Core/Src
include_dir = Core/Inc

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8       ; Đổi tên board theo chip bạn dùng (ví dụ: bluepill_f103c8, nucleo_f401re, ...)
framework = stm32cube

build_flags =
    -I Core/Inc
    -Wl,-u,_printf_float

; Nạp qua ST-Link (hoặc jlink/cmsis-dap tùy mạch nạp của bạn)
upload_protocol = stlink
debug_tool = stlink